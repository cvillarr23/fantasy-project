site_name: Fantasy Project
site_description: Cross-repo planning, architecture, and epic taxonomy for the fantasy-* project
repo_url: https://github.com/cvillarr23/fantasy-project
repo_name: cvillarr23/fantasy-project

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Project Map: project-map.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - toc:
      permalink: true
