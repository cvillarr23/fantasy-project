name: Docs build

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs-updated]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so "last updated" dates come from each page's last commit.
          fetch-depth: 0
      - name: Require the source-repo read credential
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        env:
          DOCS_REPOS_READ_TOKEN: ${{ secrets.DOCS_REPOS_READ_TOKEN }}
        run: |
          if [ -z "$DOCS_REPOS_READ_TOKEN" ]; then
            echo "::error::Set DOCS_REPOS_READ_TOKEN with Contents: read for the four source repos."
            exit 1
          fi
      - name: Checkout fantasy-core-pipeline docs
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cvillarr23/fantasy-core-pipeline
          ref: main
          path: .repo-docs/fantasy-core-pipeline
          token: ${{ secrets.DOCS_REPOS_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout fantasy-browser-worker docs
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cvillarr23/fantasy-browser-worker
          ref: main
          path: .repo-docs/fantasy-browser-worker
          token: ${{ secrets.DOCS_REPOS_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout fantasy-web-ui docs
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cvillarr23/fantasy-web-ui
          ref: master
          path: .repo-docs/fantasy-web-ui
          token: ${{ secrets.DOCS_REPOS_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout fantasy-infra docs
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cvillarr23/fantasy-infra
          ref: main
          path: .repo-docs/fantasy-infra
          token: ${{ secrets.DOCS_REPOS_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
      # The component library is published at /ui/components/ (scripts/add-ui-components.mjs).
      # web-ui's CI runs on Node 22, so build it with that before switching to the site's Node.
      - name: Set up Node for the web-ui component library
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .repo-docs/fantasy-web-ui/package-lock.json
      - name: Build the web-ui component library
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        working-directory: .repo-docs/fantasy-web-ui
        run: npm ci && npm run build-storybook
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:actions
      - run: npm run build
        env:
          FANTASY_DOCS_ROOT: ${{ github.workspace }}/.repo-docs
          # Fork and Dependabot builds validate the site and local placeholders.
          FANTASY_DOCS_SITE_ONLY: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
          FANTASY_DOCS_REQUIRED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: build
          retention-days: 7

  deploy:
    needs: build
    # Fork and Dependabot PRs don't get Actions secrets, so they build without deploying.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pages-deploy-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      # Checked out only for the pinned wrangler in package-lock.json.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: build
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          # main is the Pages production branch; any other branch is a preview.
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
          COMMIT_MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message || 'Rebuild repository docs' }}
        run: |
          npx wrangler pages deploy build \
            --project-name fantasy-project \
            --branch "$BRANCH" \
            --commit-hash "$COMMIT_HASH" \
            --commit-message "$COMMIT_MESSAGE" \
            --commit-dirty=true
          jq -r 'select(.type == "pages-deploy-detailed")
            | "url=\(.url)", "alias=\(.alias // "")", "environment=\(.environment)"' \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: Post the preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias }}
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- docs-preview -->";
            const lines = [
              marker,
              "**Docs preview** (behind Cloudflare Access)",
              "",
              "| | |",
              "|---|---|",
              `| Commit | \`${process.env.COMMIT_HASH.slice(0, 7)}\` |`,
              `| This deploy | ${process.env.DEPLOY_URL} |`,
            ];
            if (process.env.ALIAS_URL) lines.push(`| Branch alias | ${process.env.ALIAS_URL} |`);
            const body = lines.join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
